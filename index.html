/* Multiplayer rooms: room management and remote-player position display. */
const MP_STATE={socket:null,room:null,remotes:new Map(),name:"Gracz",wantTeam:0,team:0,players:[],activated:false,applying:false};

 mpRenderRoster(MP_STATE.players||[]);
}
function mpStatus(t){const e=document.getElementById('mpStatus');if(e)e.textContent=t}
function mpRenderRoster(list){
 MP_STATE.players=list||[];
 const e=document.getElementById('mpRoster');if(!e)return;
 const names=['Czerwoni','Niebiescy','Zieloni','Żółci','Błękitni','Różowi','Pomarańczowi','Fioletowi'];
 e.innerHTML='<b>GRACZE W POKOJU ('+MP_STATE.players.length+'/10)</b><br>'+MP_STATE.players.map(p=>'<div style="padding:4px;border-bottom:1px solid #777"><span style="color:'+['#e44','#69f','#5d5','#ff5','#5ee','#f8c','#fa5','#b9f'][p.team]+'">■ '+names[p.team]+'</span> — '+esc(p.name)+(MP_STATE.socket&&p.id===MP_STATE.socket.id?' (TY)':'')+'</div>').join('');
}
function mpChooseTeam(team){
 MP_STATE.wantTeam=team;
 const s=MP_STATE.socket;
 if(s&&s.connected&&MP_STATE.room){
  s.emit('room:team',{team},r=>{if(!r||!r.ok){mpStatus(r&&r.error||'Nie udało się zmienić drużyny.');return}MP_STATE.team=team;mpApplyTeam(team);mpStatus('Wybrano drużynę.');});
 }else mpStatus('Wybrana drużyna: '+['Czerwoni','Niebiescy','Zieloni','Żółci','Błękitni','Różowi','Pomarańczowi','Fioletowi'][team]);

function mpApplyTeam(team){
 team=Math.max(0,Math.min(TT.length-1,Number(team)||0));
 MP_STATE.team=team;MP_STATE.wantTeam=team;P.t=team;P.sx=TT[team].sx;P.sz=TT[team].sz;

function mpReconcileBots(list){
 if(!MP_STATE.activated)return;
 for(let team=0;team<TT.length;team++){
  const needed=(list||[]).filter(p=>p.team===team).length;
  for(let n=0;n<needed;n++){
   const i=bots.findIndex(b=>b.t===team&&!b.mpRemoved);
   if(i<0)break;
   const b=bots[i];b.mpRemoved=true;scene.remove(b.m);
   const ai=A.indexOf(b);if(ai>=0)A.splice(ai,1);

function mpEmit(event,data){const s=MP_STATE.socket;if(s&&s.connected&&MP_STATE.room&&!MP_STATE.applying)s.emit(event,data)}

 try{localStorage.setItem('bw_mp_url',url);localStorage.setItem('bw6n',name)}catch(e){}
 MP_STATE.name=name;P.name=name;
 if(MP_STATE.socket&&MP_STATE.socket.connected){mpSendRoomAction(action,code,name);return}
 if(MP_STATE.socket){MP_STATE.socket.disconnect();MP_STATE.socket=null}
 if(typeof io!=='function'){mpStatus('Nie udało się wczytać klienta Socket.IO. Odśwież stronę i spróbuj ponownie.');return}
 mpStatus('Łączenie z serwerem…');

 s.on('room:error',m=>mpStatus(m||'Błąd pokoju.'));
}
function mpSendRoomAction(action,code,name){
 const s=MP_STATE.socket;if(!s)return;
 const done=(r)=>{if(!r||!r.ok){mpStatus(r&&r.error||'Nie udało się wejść do pokoju.');return}
 MP_STATE.room=r.code;MP_STATE.team=r.team;MP_STATE.wantTeam=r.team;
 mpApplyTeam(r.team);MP_STATE.remotes.forEach((v,k)=>mpRemoteRemove(k));

 if(r.blocks)for(const b of r.blocks)mpApplyRemoteBlock(b);
 mpRenderRoster(r.players||[]);
 mpStatus('Połączono! Kod pokoju: '+r.code+' · '+r.count+'/10. Wybierz drużynę i kliknij GRAJ W POKOJU.');
 };
 if(action==='create')s.emit('room:create',{name:name,team:MP_STATE.wantTeam},done);
 else s.emit('room:join',{code:(code||'').trim().toUpperCase(),name:name,team:MP_STATE.wantTeam},done);
}
function mpRemoteUpdate(d){
 if(!d||!d.id||!Number.isFinite(d.x)||!Number.isFinite(d.y)||!Number.isFinite(d.z))return;

 let r=MP_STATE.remotes.get(d.id);
 if(!r){
  const model=human(TT[team].col,0x223344,0xe0b08a,0x88aaff);
  scene.add(model.g);
  r={id:d.id,name:String(d.name||'Gracz').slice(0,16),m:model.g,model:model,x:d.x,y:d.y,z:d.z,yaw:0,hp:20,team:team};
  MP_STATE.remotes.set(d.id,r);

  const model=human(TT[team].col,0x223344,0xe0b08a,0x88aaff);
  model.g.position.copy(pos);model.g.rotation.y=rot;model.g.visible=visible;scene.add(model.g);
  r.m=model.g;r.model=model;r.team=team;
 }
 r.x=d.x;r.y=d.y;r.z=d.z;r.yaw=Number(d.yaw)||0;r.hp=Number.isFinite(d.hp)?d.hp:20;r.alive=d.alive!==false;r.name=String(d.name||r.name);r.team=team;
 r.m.visible=r.alive;r.m.position.set(r.x,r.y,r.z);r.m.rotation.y=r.yaw;
}
function mpRemoteRemove(id){const r=MP_STATE.remotes.get(id);if(r){scene.remove(r.m);MP_STATE.remotes.delete(id)}}
function mpApplyRemoteBlock(d){

}
function mpApplyRemoteRemove(d){
 if(!d||!Number.isInteger(d.x)||!Number.isInteger(d.y)||!Number.isInteger(d.z))return;

}
